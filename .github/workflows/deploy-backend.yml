name: CI/CD Pipeline for SnapURL Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    # 1. LOCAL POWERSHELL RUNNER
    runs-on: self-hosted

    steps:
      # 1. Checkout the source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Set up Node.js environment for the backend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Install dependencies
      - name: Install Dependencies
        working-directory: ./snapurl-backend
        run: npm install

      # 3. Build the application
      - name: Build Application
        working-directory: ./snapurl-backend
        run: npm run build --if-present

      # 4. Run basic tests (executes server.test.js)
      - name: Run Tests
        working-directory: ./snapurl-backend
        run: npm test

      # Authenticate with Container Registry (Docker Hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Builds a Docker image using the backend Dockerfile
      - name: Build Docker Image
        working-directory: ./snapurl-backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/snapurl-backend:${{ github.sha }} .

      # 6. Push the Docker image to a container registry
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/snapurl-backend:${{ github.sha }}

      # 7. Deploy to Local Kubernetes
      - name: Deploy to Local Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/snapurl-backend-deployment snapurl-backend=${{ secrets.DOCKER_USERNAME }}/snapurl-backend:${{ github.sha }}