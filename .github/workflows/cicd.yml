name: SnapURL CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Test Backend
        working-directory: ./snapurl-backend
        run: |
          npm install
          npm test --if-present

      - name: 🧪 Test Frontend
        working-directory: ./snapurl-frontend
        run: |
          npm install
          npm run build --if-present
          npm test --if-present

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: ⚙️ Build and Push Backend
        working-directory: ./snapurl-backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/snapurl-backend:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/snapurl-backend:${{ github.sha }}

      - name: ⚙️ Build and Push Frontend
        working-directory: ./snapurl-frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/snapurl-frontend:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/snapurl-frontend:${{ github.sha }}

      - name: 🚀 Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/snapurl.yaml
          kubectl set image deployment/snapurl-backend-deployment snapurl-backend=${{ secrets.DOCKER_USERNAME }}/snapurl-backend:${{ github.sha }}
          kubectl set image deployment/snapurl-frontend-deployment snapurl-frontend=${{ secrets.DOCKER_USERNAME }}/snapurl-frontend:${{ github.sha }}